<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hall of Legends</title>
  <meta name="description" content="Pick a trainer from Pokémon's first four generations and battle the others in the Pokémon League.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="vendor/pixelify-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app" data-state="title">
    <header class="masthead">
      <h1 class="title">Hall of Legends</h1>
    </header>

    <section class="console" id="console" aria-label="Game">
      <div class="bezel">
        <div class="screen" id="screen">
          <div class="card card-title">
            <button class="button button-play" id="play" type="button">Play</button>
          </div>
          <div class="card card-loading" role="status" aria-live="polite">
            <p class="card-heading" id="loading-text">Loading the game</p>
            <div class="meter"><div class="meter-fill" id="meter"></div></div>
            <p class="card-note" id="loading-detail"></p>
          </div>
          <div class="card card-error" role="alert">
            <p class="card-heading">The game didn't start</p>
            <p class="card-note" id="error-text"></p>
            <button class="button button-play" id="retry" type="button">Try again</button>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <button class="button button-quiet" id="sound" type="button" aria-pressed="false" disabled>Mute</button>
        <button class="button button-quiet" id="fullscreen" type="button" disabled>Full screen</button>
      </div>

      <div class="pad" aria-label="Touch controls">
        <div class="dpad" aria-label="Directional pad" role="group">
          <span class="dpad-arm dpad-up"></span>
          <span class="dpad-arm dpad-left"></span>
          <span class="dpad-arm dpad-center"></span>
          <span class="dpad-arm dpad-right"></span>
          <span class="dpad-arm dpad-down"></span>
        </div>
        <div class="face">
          <button class="pad-button pad-b" type="button" data-button="b">B</button>
          <button class="pad-button pad-a" type="button" data-button="a">A</button>
        </div>
        <div class="meta">
          <button class="pad-pill" type="button" data-button="select">Select</button>
          <button class="pad-pill" type="button" data-button="start">Start</button>
        </div>
      </div>
    </section>

    <section class="guide">
      <h2 class="guide-heading">Keyboard</h2>
      <dl class="keys">
        <div><dt><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></dt><dd>Move the cursor, walk</dd></div>
        <div><dt><kbd>X</kbd></dt><dd>A button: confirm, talk</dd></div>
        <div><dt><kbd>Z</kbd></dt><dd>B button: back, cancel</dd></div>
        <div><dt><kbd>Enter</kbd></dt><dd>Start</dd></div>
        <div><dt><kbd>Right Shift</kbd></dt><dd>Select: credits, on the battle style screen</dd></div>
      </dl>
    </section>
  </main>
</body>
</html>
